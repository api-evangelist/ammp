name: AMMP
description: >-
  AMMP (AMMP OS) is a distributed energy monitoring and operations platform for
  operators of commercial and industrial (C&I) solar and battery-storage
  portfolios. It unifies visibility across multi-vendor fleets, pulling data
  directly from more than 30 manufacturer cloud platforms and its own AMMP Edge
  data logger, and layers on monitoring, alerting, stakeholder reporting,
  commercial (SLA/cost) tracking, and customizable dashboards. AMMP OS monitors
  over 10,000 sites across 35+ countries and emphasizes vendor independence and
  ISO/IEC 27001:2022 certified security. Surfaced as a portfolio company of
  point-nine and enriched by the API Evangelist network.
